name: reloj
on:
  # El reloj corre sin parar y se releva solo (workflow_dispatch, que GitHub no descarta).
  # Este schedule es solo el arranque de respaldo por si la cadena se rompe: GitHub descarta
  # la mayoria de los schedule, y cada 15 min basta con que llegue uno. Si ya hay un reloj
  # corriendo, el intento queda en cola y el siguiente lo reemplaza (concurrency): nunca hay
  # dos relojes a la vez. Hasta el 2026-09-14 solo arrancaba lun-jue de 13 a 23Z, y el primer
  # dia de ventana GitHub descarto todos los arranques de la manana.
  #
  # 2026-09-29 — DESACTIVADO por el cupo de TomTom (agotado el 18-sep; 20,000 por mes, no 2,500
  # por dia). Ver exi-juarez docs/ops/2026-09-29_diagnostico_cupo_tomtom.md. El reloj no consume
  # TomTom: el libro de presupuesto y la reserva de pareo viven en exi-juarez, que revisa el libro
  # en cada corrida. Al reactivar (1-oct o despues, decision de PMC), descomentar
  # EXI_CALENDARIO: presupuesto en el paso `loop` para que el reloj dispare solo en las 6 ranuras
  # diarias del calendario propuesto, y poner modo = "presupuesto" en exi-juarez.
  schedule:
    - cron: "*/15 * * * *"
  # El relevo (antes del limite de 6 h por job) llega por aqui, y tambien el arranque manual.
  workflow_dispatch:
    inputs:
      prueba:
        description: "Disparar una vez al arrancar, para verificar el token"
        type: boolean
        default: false

permissions:
  contents: write    # el latido
  actions: write     # el relevo: GITHUB_TOKEN si puede disparar workflow_dispatch

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - id: loop
        name: dormir y disparar acquire.yml de exi-juarez en cada ranura
        run: python3 reloj.py
        env:
          EXI_DISPATCH_TOKEN: ${{ secrets.EXI_DISPATCH_TOKEN }}
          PRUEBA: ${{ inputs.prueba }}
          # EXI_CALENDARIO: presupuesto   # propuesta 2026-09-29, NO ACTIVA (ver arriba)
      - name: latido
        if: always() && steps.loop.outputs.inicio != '' && (steps.loop.outputs.disparos != '0' || steps.loop.outputs.fallos != '0')
        run: |
          echo "- ${{ steps.loop.outputs.inicio }} → ${{ steps.loop.outputs.fin }} (hora de Juarez) · disparos ${{ steps.loop.outputs.disparos }} · fallos ${{ steps.loop.outputs.fallos }}" >> latido.md
          git config user.name  "exi-reloj-bot"
          git config user.email "exi-reloj-bot@users.noreply.github.com"
          git add latido.md
          git commit -m "latido $(date -u +%FT%H%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
      - name: relevo
        # always(): ni una ranura fallida ni un latido que no empuje deben romper la cadena.
        if: always() && steps.loop.outputs.relevo == 'true'
        run: gh workflow run reloj.yml -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
